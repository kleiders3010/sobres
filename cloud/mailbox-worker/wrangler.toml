# Cloud mailbox (developer-run slot store, always written; reads follow helper health). Free plan:
# SQLite-backed Durable Objects only.
name = "kt-mailbox"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
# A stable address on our own domain (DNS is on Cloudflare): the app ships this URL.
routes = [{ pattern = "mailbox.jurisgames.com", custom_domain = true }]

[[durable_objects.bindings]]
name = "TOPICS"
class_name = "Topic"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Topic"]

# Budgets per network (IPv6 /64), checked in the Worker before a Durable Object wakes (safety audit round 4,
# T4). A device reads its topics every few rounds; these sit far above a household on one address.
[[ratelimits]]
name = "READS"
namespace_id = "2107"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "WRITES"
namespace_id = "2108"
simple = { limit = 120, period = 60 }
